name: Package Windows x64 test v5

on:
  push:
    paths:
      - '.github/workflows/package-windows-x64-test-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld mingw-w64 cmake ninja-build zip file

      - name: Build native Windows core
        run: |
          set -eux
          OUT="$PWD/out-windows-x64"
          mkdir -p "$OUT"
          for lib in kernel32 user32 gdi32 gdiplus winmm; do
            lld-link /lib /def:"$PWD/windows-build/$lib.def" /machine:x64 /out:"$OUT/$lib.lib"
          done
          clang++ --target=x86_64-pc-windows-msvc \
            -I"$PWD/src/windows" \
            -c "$PWD/src/windows/V_mini_me_win_release.cpp" \
            -o "$OUT/V_mini_me_win.obj" \
            -O2 -ffreestanding -fno-exceptions -fno-rtti -fno-stack-protector \
            -mno-stack-arg-probe -fno-builtin -nostdlib -nostdinc++
          lld-link /out:"$OUT/V_mini_me.exe" /entry:mainCRTStartup \
            /subsystem:console,6.01 /machine:x64 /opt:ref /opt:icf \
            "$OUT/V_mini_me_win.obj" \
            "$OUT/kernel32.lib" "$OUT/user32.lib" "$OUT/gdi32.lib" \
            "$OUT/gdiplus.lib" "$OUT/winmm.lib"
          file "$OUT/V_mini_me.exe"

      - name: Build raylib 6.0 for Windows with MinGW
        run: |
          set -eux
          curl -L --fail --retry 3 https://github.com/raysan5/raylib/archive/refs/tags/6.0.tar.gz -o /tmp/raylib-6.0.tar.gz
          tar -xzf /tmp/raylib-6.0.tar.gz -C /tmp
          cat >/tmp/mingw-x64.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)
          set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
          set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
          set(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF
          cmake -S /tmp/raylib-6.0 -B /tmp/raylib-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/mingw-x64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF
          cmake --build /tmp/raylib-build --target raylib
          find /tmp/raylib-build -name 'libraylib.a' -print

      - name: Build Windows raylib launcher
        run: |
          set -eux
          RAYLIB=$(find /tmp/raylib-build -type f -name libraylib.a | head -1)
          test -n "$RAYLIB"
          x86_64-w64-mingw32-g++ \
            -O2 -std=c++17 -Wall -Wextra -Wpedantic \
            -I/tmp/raylib-6.0/src -Ilauncher/windows \
            launcher/windows/V_mini_me_launcher_build_v2.cpp "$RAYLIB" \
            -static -static-libgcc -static-libstdc++ \
            -lopengl32 -lgdi32 -lwinmm -lshell32 -luser32 -lkernel32 \
            -o out-windows-x64/V_mini_me_launcher.exe
          x86_64-w64-mingw32-strip out-windows-x64/V_mini_me_launcher.exe || true
          file out-windows-x64/V_mini_me_launcher.exe

      - name: Verify Windows imports
        run: |
          set -eux
          echo '--- core imports ---'
          llvm-objdump -p out-windows-x64/V_mini_me.exe | grep 'DLL Name' | tee core-imports.txt
          echo '--- launcher imports ---'
          x86_64-w64-mingw32-objdump -p out-windows-x64/V_mini_me_launcher.exe | grep 'DLL Name' | tee launcher-imports.txt
          ! grep -Eiq 'libstdc\+\+|libgcc|libwinpthread' launcher-imports.txt

      - name: Assemble package
        run: |
          set -eux
          PKG='V_mini_me-windows-x86_64-test'
          rm -rf "$PKG" dist/windows
          mkdir -p "$PKG" dist/windows
          cp out-windows-x64/V_mini_me.exe "$PKG/V_mini_me.exe"
          cp out-windows-x64/V_mini_me_launcher.exe "$PKG/V_mini_me_launcher.exe"
          cp config.example.ini "$PKG/config.ini"
          cp -a avatar "$PKG/avatar"
          cp LICENSE "$PKG/LICENSE"
          cat > "$PKG/README_WINDOWS_TEST.txt" <<'EOF'
          V_mini_me Windows x86-64 functional-parity test build

          Recommended start: double-click V_mini_me_launcher.exe
          Direct core start: double-click V_mini_me.exe

          Function is translated from the Linux release using Windows-native equivalents:
          - same config.ini keys and avatar folder layout
          - same direction modes, deadzone and mouse tracking behavior
          - microphone reaction and talking PNG fallback
          - talking bounce, idle bob and idle sway
          - Quick Expressions slots and live switching
          - avatar/expression folder picker
          - Save / Start / Reload / Stop workflow

          Windows implementation:
          - core: native Win32/GDI+/WinMM
          - launcher: raylib 6.0 built with the same MinGW toolchain + Win32 process/pipe control

          Initial target: Windows 10/11 x86-64.
          EOF
          sha256sum "$PKG/V_mini_me.exe" "$PKG/V_mini_me_launcher.exe" > "$PKG/SHA256SUMS.txt"
          zip -r -9 "dist/windows/${PKG}.zip" "$PKG"
          ls -lh "dist/windows/${PKG}.zip"

      - name: Commit Windows package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p launcher/bin/windows-x86_64
          cp out-windows-x64/V_mini_me_launcher.exe launcher/bin/windows-x86_64/V_mini_me_launcher.exe
          git add -f dist/windows/V_mini_me-windows-x86_64-test.zip launcher/bin/windows-x86_64/V_mini_me_launcher.exe
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Windows x64 functional parity test package [skip ci]'
          git pull --rebase
          git push
