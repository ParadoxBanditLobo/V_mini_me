name: Build Linux launcher folder picker

on:
  push:
    paths:
      - '.github/workflows/build-linux-launcher-v2.yml'
      - 'launcher/linux/V_mini_me_launcher_v2.cpp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install linker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgl1-mesa-dev libx11-dev
      - name: Download raylib 6.0
        run: |
          curl -L --fail --retry 3 https://github.com/raysan5/raylib/releases/download/6.0/raylib-6.0_linux_amd64.tar.gz -o /tmp/raylib.tar.gz
          tar -xzf /tmp/raylib.tar.gz -C /tmp
      - name: Build updated launcher
        run: |
          mkdir -p launcher/bin/linux-x86_64
          c++ -O2 -std=c++17 -Wall -Wextra -Wpedantic \
            -I/tmp/raylib-6.0_linux_amd64/include \
            launcher/linux/V_mini_me_launcher_v2.cpp \
            /tmp/raylib-6.0_linux_amd64/lib/libraylib.a \
            -lGL -lm -lpthread -ldl -lrt -lX11 \
            -o launcher/bin/linux-x86_64/V_mini_me_launcher
          strip launcher/bin/linux-x86_64/V_mini_me_launcher || true
          file launcher/bin/linux-x86_64/V_mini_me_launcher
          sha256sum launcher/bin/linux-x86_64/V_mini_me_launcher
      - name: Commit updated launcher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f launcher/bin/linux-x86_64/V_mini_me_launcher
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build launcher with folder picker [skip ci]'
          git push
