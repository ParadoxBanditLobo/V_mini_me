name: Diagnose Windows link

on:
  push:
    paths:
      - '.github/workflows/diagnose-windows-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Build and capture diagnostics
        shell: bash
        run: |
          set +e
          OUT="$PWD/out-windows-x64"
          mkdir -p "$OUT"
          : > windows-link-build-diagnostic.txt
          for lib in kernel32 user32 gdi32 gdiplus winmm; do
            lld-link /lib /def:"$PWD/windows-build/$lib.def" /machine:x64 /out:"$OUT/$lib.lib" >> windows-link-build-diagnostic.txt 2>&1
            echo "lib_$lib=$?" >> windows-link-build-diagnostic.txt
          done
          clang++ --target=x86_64-pc-windows-msvc \
            -I"$PWD/src/windows" \
            -c "$PWD/src/windows/V_mini_me_win_release.cpp" \
            -o "$OUT/V_mini_me_win.obj" \
            -O2 -ffreestanding -fno-exceptions -fno-rtti -fno-stack-protector \
            -fno-builtin -nostdlib -nostdinc++ \
            >> windows-link-build-diagnostic.txt 2>&1
          echo "compile=$?" >> windows-link-build-diagnostic.txt
          lld-link \
            /out:"$OUT/V_mini_me.exe" \
            /entry:mainCRTStartup \
            /subsystem:console,6.01 \
            /machine:x64 /opt:ref /opt:icf \
            "$OUT/V_mini_me_win.obj" \
            "$OUT/kernel32.lib" "$OUT/user32.lib" "$OUT/gdi32.lib" \
            "$OUT/gdiplus.lib" "$OUT/winmm.lib" \
            >> windows-link-build-diagnostic.txt 2>&1
          echo "link=$?" >> windows-link-build-diagnostic.txt
          cat windows-link-build-diagnostic.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f windows-link-build-diagnostic.txt
          git commit -m 'Capture Windows link diagnostic [skip ci]' || exit 0
          git push
