name: Export optional Linux launcher

on:
  push:
    paths:
      - '.github/workflows/export-linux-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Export launcher as text chunks
        run: |
          set -eux
          test -x launcher/bin/linux-x86_64/V_mini_me_launcher
          rm -rf launcher/bin/linux-x86_64/base64
          mkdir -p launcher/bin/linux-x86_64/base64
          base64 -w0 launcher/bin/linux-x86_64/V_mini_me_launcher > /tmp/launcher.b64
          split -b 60000 -d -a 3 /tmp/launcher.b64 launcher/bin/linux-x86_64/base64/chunk_
          sha256sum launcher/bin/linux-x86_64/V_mini_me_launcher | awk '{print $1}' > launcher/bin/linux-x86_64/base64/sha256.txt
          stat -c '%s' launcher/bin/linux-x86_64/V_mini_me_launcher > launcher/bin/linux-x86_64/base64/size.txt
          ls -l launcher/bin/linux-x86_64/base64
      - name: Commit export chunks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f launcher/bin/linux-x86_64/base64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Export Linux launcher for packaging [skip ci]'
          git push
