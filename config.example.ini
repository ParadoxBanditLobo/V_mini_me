# V_mini_me configuration example
# Copy this to config.ini if you want to edit settings before first run.
# config.ini itself is ignored by Git because it can contain machine-local paths
# and device identifiers after the setup menu saves your choices.

avatar_dir=avatar/default

# horizontal = left / center / right
# fourway   = left / right / up / down + center
# quadrants = four diagonal quadrants + center
# eightway  = all eight directions + center
direction_mode=eightway

# Size of the center dead zone, 0.0 to 0.95.
deadzone=0.15

# How often mouse direction is checked. 100 ms = 10 checks/second.
update_ms=100

# Avatar display scale. 0.5 = half size, 2.0 = double size.
scale=1.0

# Initial window position in pixels.
window_x=40
window_y=40

always_on_top=true
draggable=true
show_setup_on_start=true

# --- Microphone reaction --------------------------------------------------
# Blank uses the default recording device.
# Linux: PulseAudio/PipeWire source name may be used.
# Windows: numeric waveIn device ID may be used.
mic_enabled=true
mic_device=
mic_threshold=0.035
mic_release_ms=250

# Optional simple PNGTuber-style bounce while talking.
talk_bounce=true
bounce_pixels=4
bounce_interval_ms=150

# --- Idle motion ----------------------------------------------------------
# Gentle vertical movement around the normal resting position.
idle_bob=false
idle_bob_pixels=3
idle_bob_period_ms=2400
